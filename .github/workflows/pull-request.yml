name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  player-journeys:
    name: Player release journeys
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Verify approved SuitFire art, exact mappings and retained originals
        run: npm run check:suitfire-art

      - name: Build client
        run: npm run build:client

      - name: Check client bundle budgets
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test paid support zones on desktop, phone and React fallback
        run: npm run test:e2e:support

      - name: Test draft entry, picks, reconnects and deck saving
        run: npx playwright test --config=playwright.draft.config.js

      - name: Test deck workshop and pack reveals
        run: npm run test:e2e:workshop

      - name: Test collector version selection and table foil
        run: npx playwright test --config=playwright.collector.config.js

      - name: Check browser usability
        run: npm run test:e2e:usability

      - name: Test Command Deck navigation and account layouts
        run: npm run test:e2e:command-deck

      - name: Test released menus with customization disabled
        run: npm run test:e2e:release-menus

      - name: Test optional SuitFire presentation on desktop and phone
        run: |
          npx playwright test --config=playwright.suitfire.config.js
          npm run check:bundle

      - name: Check compiled Babylon performance safeguards
        run: npm run test:e2e:performance

      - name: Test live Babylon browser flows
        run: npm run test:e2e

      - name: Upload Babylon performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-performance-report
          path: artifacts/babylon-performance/current.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  unit-checks:
    name: Unit verification · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci
      - name: Check server syntax and rules
        if: matrix.suite == 'server'
        run: |
          npm run check:server
          npm run test:server
      - name: Test client behavior and development boundaries
        if: matrix.suite == 'client'
        run: |
          npm run test:client
          npm --prefix client run test:toolchain
      - name: Test engine tooling and qualification gates
        if: matrix.suite == 'client'
        run: npm run test:qualification

  check:
    name: check
    needs: [unit-checks, player-journeys]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all unit and player checks
        env:
          UNIT_RESULT: ${{ needs.unit-checks.result }}
          PLAYER_RESULT: ${{ needs.player-journeys.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$PLAYER_RESULT" = success

  admin-journeys:
    name: Admin journeys · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, assets, authoring, navigation, creative]
    env:
      GAUNTLET_ADMIN_USE_BUILD: 'true'
      GAUNTLET_ADMIN_FIXTURE_PORT: '4117'
      GAUNTLET_ADMIN_CLIENT_PORT: '3117'
      GAUNTLET_ADMIN_EVIDENCE_DIR: '../artifacts/admin-refinement-regression'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build client for the isolated Admin service
        env:
          REACT_APP_SOCKET_URL: 'http://127.0.0.1:4117'
        run: npm run build:client
      - name: Test private Admin
        if: matrix.suite == 'core'
        run: npm run test:e2e:admin -- --reporter=line
      - name: Test immutable assets and printing releases
        if: matrix.suite == 'assets'
        run: npx playwright test --config=playwright.printings.config.js
      - name: Test authored deck purchase and restart journey
        if: matrix.suite == 'assets'
        run: npx playwright test --config=playwright.purpose.config.js
      - name: Test authored mechanics, campaigns, cosmetics and payment readiness
        if: matrix.suite == 'authoring'
        run: npx playwright test --config=playwright.phase2.config.js
      - name: Test resumable production paths, website prose and audited player repairs
        if: ${{ !cancelled() && matrix.suite == 'authoring' }}
        run: npx playwright test --config=playwright.production.config.js --output=test-results/production
      - name: Test separate Gems and atomic split-price purchases
        if: matrix.suite == 'assets'
        run: npx playwright test --config=playwright.gems.config.js
      - name: Test Admin refinement, accessibility and exact-revision review
        if: matrix.suite == 'navigation'
        run: npx playwright test --config=playwright.admin-redesign.config.js --output=test-results/redesign
      - name: Test focused editor refinement
        if: ${{ !cancelled() && matrix.suite == 'navigation' }}
        run: npx playwright test --config=playwright.admin-refinement.config.js --output=test-results/refinement
      - name: Test authoring pipelines
        if: ${{ !cancelled() && matrix.suite == 'navigation' }}
        run: npx playwright test --config=playwright.admin-pipelines.config.js --output=test-results/pipelines
      - name: Test studio entry, website and season eligibility
        if: ${{ !cancelled() && matrix.suite == 'navigation' }}
        run: npx playwright test --config=playwright.admin-studio.config.js --grep "Home stays|website artwork|phone website|season eligibility" --output=test-results/studio
      - name: Test corrected editors, visual guidance and creative acceptance journeys
        if: matrix.suite == 'creative'
        run: npx playwright test --config=playwright.admin-correction.config.js --output=test-results/correction
      - name: Test visual operator guidance
        if: ${{ !cancelled() && matrix.suite == 'creative' }}
        run: npx playwright test --config=playwright.admin-guidance.config.js --output=test-results/guidance
      - name: Test creative acceptance journeys
        if: ${{ !cancelled() && matrix.suite == 'creative' }}
        run: npx playwright test --config=playwright.admin-creative.config.js --output=test-results/creative
      - name: Upload failed Admin diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-diagnostics-${{ matrix.suite }}
          path: |
            test-results/
            artifacts/immutable-assets/
            artifacts/printings/browser/
            artifacts/purpose/browser/
            artifacts/admin-refinement-regression/
            artifacts/admin-pipeline-*.png
            artifacts/admin-pipelines-results.json
            artifacts/admin-studio-results.json
            artifacts/admin-correction-results.json
            artifacts/admin-guidance-results.json
            artifacts/admin-creative-results.json
            docs/reviews/admin-creative/
            artifacts/admin-guidance-zoom.log
            docs/reviews/admin-guidance/
            docs/reviews/admin-correction/after/
            docs/reviews/admin-correction/after-activities/
            docs/reviews/admin-correction/native-zoom/
            docs/reviews/admin-refinement/after/
          if-no-files-found: ignore
          retention-days: 7

  admin-release:
    name: Admin release journeys
    needs: admin-journeys
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every isolated Admin journey group
        env:
          ADMIN_JOURNEYS_RESULT: ${{ needs.admin-journeys.result }}
        run: test "$ADMIN_JOURNEYS_RESULT" = success

  dependency-audit:
    name: Release dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit all committed lockfiles
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --audit-level=high
          npm --prefix client audit --audit-level=high
