name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Check server syntax
        run: npm run check:server

      - name: Test server rules
        run: npm run test:server

      - name: Test client behavior
        run: npm run test:client

      - name: Build client
        run: npm run build:client

      - name: Check client bundle budgets
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test live Babylon browser flows
        run: npm run test:e2e

      - name: Test draft entry, picks, reconnects and deck saving
        run: npx playwright test --config=playwright.draft.config.js

      - name: Test deck workshop and pack reveals
        run: npm run test:e2e:workshop

      - name: Test collector version selection and table foil
        run: npx playwright test --config=playwright.collector.config.js

      - name: Check browser usability
        run: npm run test:e2e:usability

      - name: Check compiled Babylon performance safeguards
        run: npm run test:e2e:performance

      - name: Test private Admin and controlled authoring
        run: npm run test:e2e:admin

      - name: Upload Babylon performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-performance-report
          path: artifacts/babylon-performance/current.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
