name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Check server syntax
        run: npm run check:server

      - name: Test server rules
        run: npm run test:server

      - name: Test client behavior
        run: npm run test:client

      - name: Build client
        run: npm run build:client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test live Babylon browser flows
        run: npm run test:e2e

      - name: Check compiled Babylon performance safeguards
        run: npm run test:e2e:performance
