name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Check server syntax
        run: npm run check:server

      - name: Test server rules
        run: npm run test:server

      - name: Test client behavior
        run: npm run test:client

      - name: Test build configuration and development server boundaries
        run: npm --prefix client run test:toolchain

      - name: Build client
        run: npm run build:client

      - name: Check client bundle budgets
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test paid support zones on desktop, phone and React fallback
        run: npm run test:e2e:support

      - name: Test draft entry, picks, reconnects and deck saving
        run: npx playwright test --config=playwright.draft.config.js

      - name: Test deck workshop and pack reveals
        run: npm run test:e2e:workshop

      - name: Test collector version selection and table foil
        run: npx playwright test --config=playwright.collector.config.js

      - name: Check browser usability
        run: npm run test:e2e:usability

      - name: Check compiled Babylon performance safeguards
        run: npm run test:e2e:performance

      - name: Test live Babylon browser flows
        run: npm run test:e2e

      - name: Upload Babylon performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-performance-report
          path: artifacts/babylon-performance/current.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  admin-release:
    name: Admin release journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test private Admin and build its compiled client
        run: npm run test:e2e:admin
      - name: Test immutable assets and printing releases
        run: npx playwright test --config=playwright.printings.config.js
      - name: Test authored deck purchase and restart journey
        run: npx playwright test --config=playwright.purpose.config.js
      - name: Test authored mechanics, campaigns, cosmetics and payment readiness
        run: npx playwright test --config=playwright.phase2.config.js
      - name: Test separate Gems and atomic split-price purchases
        run: npx playwright test --config=playwright.gems.config.js
      - name: Upload failed Admin diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-diagnostics
          path: |
            test-results/
            artifacts/immutable-assets/
            artifacts/printings/browser/
            artifacts/purpose/browser/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Release dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit all committed lockfiles
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --audit-level=high
          npm --prefix client audit --audit-level=high
